<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
body {
font-family: Arial, Helvetica, sans-serif;

}

table {

border-collapse: collapse;
}

table > thead > tr > th {
border: 1px solid;
padding: 10px;
width: 600px;
}


table > tbody > tr >td {
border: 1px solid;
padding: 10px;
width: 600px;
}

tbody > tr > th {
border: 1px solid;
padding: 10px;
width: 600px;

}

td.Medias {
text-align: center;
}

.Colorido {
background-color: rgb(149, 169, 185);
color: aliceblue;
border: 1px solid black;
}

.carea {
    background-color: aliceblue;
}


.cd {
background-color: antiquewhite;

}

div#container {
overflow-x: auto;

}


    </style>
</head>
<body>

<div id="container">
    <table>
        <colgroup>
        <col class="carea">
        <col class="cd" span="4">
        </colgroup>
    
    
        <caption><strong>Tabela do Brasileirão</strong></caption>
        <thead>
            <tr>
                <th rowspan="2" class="Colorido" scope="col">Área</th>
                <th rowspan="2" class="Colorido" scope="col">Disciplinas</th>
                <th colspan="2" class="Colorido" scope="colgroup">Notas</th>
                <th rowspan="2" class="Colorido" scope="col">Media</th>
    
    
                <tr>
                <th class="Colorido" scope="col">Nota 1</th>
                <th class="Colorido" scope="col">Nota 2</th>
                </tr>
    
    
        </thead>
    
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Exatas</th>
                <td>Matématica</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
    
            </tr>
    
            <tr>
                <td>Ciências</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
            </tr>
                <tr>
                    <td>Informática</td>
                    <td class="Medias">10,00</td>
                    <td class="Medias">10,00</td>
                    <td class="Medias">10,00</td>
    
                </tr>
    
            <tr>
                <th colspan="4" class="Colorido" scope="row">Medias exatas</th>
                <td class="Medias Colorido">10,00</th>
            </tr>
    
               <th rowspan="2">Humanas</th>
                <td>Historia</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
    
    
            <tr>
                <td>Historia</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
                <td class="Medias">10,00</td>
            </tr>
    
            <tr>
                <th colspan="4" class="Colorido" scope="row">Medias de Humanas</th>
                <td class="Medias Colorido">10,00</th>
            </tr>
    
        </tbody>
    
    
    
    </table>
</div>
    


</body>
</html>
