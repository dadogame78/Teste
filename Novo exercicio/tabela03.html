<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tabela 3</title>
    <style>

body {
font-family: Arial, Helvetica, sans-serif;
}
table {
border-collapse: collapse;

}


td {
border: 1px solid black;
padding: 20px;
}


    </style>
</head>
<body>
<table>
    <tr>
        <td>a</td>
        
        <td colspan="2">c</td>
    </tr>

    <tr>
        <td colspan="2">d</td>
        
        <td>f</td>
    </tr>

    <tr>
        
        <td colspan="2">h</td>
        <td>l</td>
    </tr>

    <tr>
        <td>i</td>
        <td>j</td>
        <td>m</td>
    </tr>
</table>    
</body>
</html>
